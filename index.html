<html>

<head>
    <meta charset="utf-8">
    <title>Ram Thakare's Personnel Site</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* General page styling */
        body {
            margin: 0;
            padding: 40px;
            background-color: #f4f7fb;
            color: #2c3e50;
            font-family: Arial, Helvetica, sans-serif;
            line-height: 1.6;
        }

        /* Main content */
        body {
            max-width: 900px;
            margin: 40px auto;
            background-color: white;
            border-radius: 15px;
            padding: 50px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
        }

        /* Profile picture */
        img {
            display: block;
            width: 150px;
            height: 150px;
            object-fit: cover;
            border-radius: 50%;
            border: 5px solid #3498db;
            margin-bottom: 20px;
        }

        /* Main heading */
        h1 {
            color: #1a252f;
            font-size: 38px;
            margin-bottom: 5px;
        }

        /* Paragraph */
        p {
            font-size: 17px;
            color: #555;
        }

        /* Links */
        a {
            color: #3498db;
            text-decoration: none;
            font-weight: bold;
        }

        a:hover {
            color: #e74c3c;
            text-decoration: underline;
        }

        /* Section heading */
        h3 {
            color: #2c3e50;
            font-size: 24px;
            margin-top: 30px;
        }

        /* Horizontal lines */
        hr {
            border: none;
            height: 2px;
            background-color: #3498db;
            margin: 30px 0;
        }

        /* Book list */
        ul {
            background-color: #f8f9fa;
            padding: 20px 35px;
            border-left: 5px solid #3498db;
            border-radius: 8px;
        }

        li {
            margin: 10px 0;
            color: #444;
        }

        /* Hobby and contact links */
        body>a {
            display: inline-block;
            margin: 8px 10px 8px 0;
            padding: 10px 18px;
            background-color: #3498db;
            color: white;
            border-radius: 6px;
            transition: 0.3s;
        }

        body>a:hover {
            background-color: #217dbb;
            color: white;
            text-decoration: none;
            transform: translateY(-2px);
        }

        /* Mobile responsive design */
        @media (max-width: 600px) {
            body {
                margin: 15px;
                padding: 25px;
            }

            h1 {
                font-size: 30px;
            }

            img {
                width: 120px;
                height: 120px;
            }

            p {
                font-size: 15px;
            }
        }
    </style>
</head>
